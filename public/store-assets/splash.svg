<svg xmlns="http://www.w3.org/2000/svg" width="2732" height="2732" viewBox="0 0 64 64">
  <!--
    Splash master (issue #440, mark re-branded #520/#523): the splash carries the
    current double-struck X, not the retired Clink. The FIELD stays ink-deep per
    the #523 splash decision (splashes are NOT icons and keep the coral-on-ink
    treatment — the native splash-dark.png source is the same ink field + coral
    mark), so only the mark is ported. Centred coral double-struck X at scale 0.28
    (the mark spans ~21% of the canvas, ~575px at 2732), with the faint candle
    glow behind it. NO ember — the static exports drop it. One splash serves light
    and dark: the field IS the dark theme's deepest well, and a bright launch
    flash is exactly what a night-out app should not do.
  -->
  <defs>
    <radialGradient id="candle" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5a5f" stop-opacity="0.10"/>
      <stop offset="0.6" stop-color="#ff5a5f" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ff5a5f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" fill="#060607"/>
  <circle cx="32" cy="32" r="11" fill="url(#candle)"/>
  <g transform="translate(32 32) scale(0.28) translate(-32 -32)">
    <polygon points="42,10 47,10 13,54 8,54" fill="#ff5a5f"/>
    <polygon points="51,10 56,10 22,54 17,54" fill="#ff5a5f"/>
    <polygon points="9,10 21,10 55,54 43,54" fill="#ff5a5f"/>
  </g>
</svg>
