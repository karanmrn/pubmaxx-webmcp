<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbf8f0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#090806" />
    <title>PUBMAXX is offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --bg: #fbf8f0;
        --panel: #fffdf7;
        --ink: #16122a;
        --soft: #625d70;
        --line: #d9d2c5;
        --coral: #db3942;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #090806;
          --panel: #171712;
          --ink: #fff8e7;
          --soft: #c9c0ac;
          --line: #403d34;
          --coral: #ff5a5f;
        }
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding:
          max(24px, env(safe-area-inset-top, 0px))
          max(20px, env(safe-area-inset-right, 0px))
          max(24px, env(safe-area-inset-bottom, 0px))
          max(20px, env(safe-area-inset-left, 0px));
        background: var(--bg);
        color: var(--ink);
      }

      main {
        width: min(100%, 420px);
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--panel);
        box-shadow: 0 18px 55px rgb(0 0 0 / 12%);
      }

      .mark {
        width: 46px;
        height: 46px;
        margin-bottom: 26px;
        color: var(--coral);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.75rem, 8vw, 2.35rem);
        line-height: 1;
        letter-spacing: -0.04em;
      }

      p {
        margin: 16px 0 0;
        color: var(--soft);
        font-size: 1rem;
        line-height: 1.55;
      }

      button {
        width: 100%;
        min-height: 48px;
        margin-top: 24px;
        border: 0;
        border-radius: 999px;
        background: var(--coral);
        color: #fff;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M18.5 18.5 L45.5 45.5 M45.5 18.5 L18.5 45.5" fill="none" stroke="currentColor" stroke-width="8.5" stroke-linecap="round" />
        <circle cx="32" cy="32" r="4" fill="currentColor" />
      </svg>
      <h1>No signal yet.</h1>
      <p>PUBMAXX needs a connection for live prices, opening times, and travel. Nothing stale is being shown.</p>
      <button type="button" onclick="window.location.replace('https://pubmaxxing.com')">Try again</button>
    </main>
  </body>
</html>
