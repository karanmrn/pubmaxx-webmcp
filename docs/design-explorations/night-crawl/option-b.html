<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PUBMAXX night crawl · Option B - One giant action</title>
<style>
  /* ── House tokens, dark (B Night Out), coral accent per U7 brief ──────────
     Mirrors docs/DESIGN_SYSTEM.md dark column. Bungee QUARANTINED, so display
     caps use a letter-spaced system stack. Zero external requests. */
  :root {
    --paper: #070b0a;
    --panel: #0e1613;
    --panel-raised: #141c19;
    --panel-hi: #1a2420;
    --ink: #eef3ef;
    --ink-soft: #c5d0c9;
    --muted: #8fa399;
    --line: #24302b;
    --coral: #ff5a5f;
    --coral-bright: #ff7a55;
    --pint: #3dff9a;
    --amber: #f0a01a;
    --brick: #ff6b7a;
    --font-display: "SF Pro Display", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-data: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh; display: grid; place-items: center; padding: 26px 16px;
    background: #050708;
    font-family: var(--font-ui); color: var(--ink); -webkit-font-smoothing: antialiased;
  }
  .caption {
    max-width: 390px; margin: 0 auto 16px; color: #6c7b74;
    font-size: 12px; line-height: 1.5; text-align: center;
  }
  .caption b { color: #9fb0a8; font-weight: 600; }

  .phone {
    position: relative; width: 390px; height: 844px; border-radius: 46px; padding: 12px;
    background: linear-gradient(160deg, #1c2620, #0a0f0d);
    box-shadow: 0 40px 90px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.04);
  }
  .screen {
    position: relative; width: 100%; height: 100%; border-radius: 36px; overflow: hidden;
    background: var(--paper); display: flex; flex-direction: column;
  }

  .statusbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px 4px; font-family: var(--font-data);
    font-size: 13px; font-weight: 600; color: var(--ink);
  }
  .vitals { display: flex; align-items: center; gap: 10px; }
  .vitals .weak { color: var(--muted); letter-spacing: 1px; }
  .batt { display: inline-flex; align-items: center; gap: 5px; color: var(--amber); }
  .batt .cell { width: 22px; height: 11px; border-radius: 3px; border: 1.5px solid var(--amber); position: relative; padding: 1.5px; }
  .batt .cell::after { content: ""; position: absolute; right: -3px; top: 3px; width: 2px; height: 5px; border-radius: 1px; background: var(--amber); }
  .batt .fill { display: block; width: 15%; height: 100%; border-radius: 1px; background: var(--amber); }

  /* ── Tiny top context bar - everything you need to KNOW, nothing to tap ── */
  .context {
    padding: 10px 22px 4px; text-align: center;
  }
  .context .crawl {
    font-family: var(--font-display); font-size: 11px; font-weight: 800;
    letter-spacing: 0.24em; text-transform: uppercase; color: var(--coral);
  }
  .dots { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
  .d { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
  .d.done { background: var(--pint); }
  .d.now { background: var(--coral); box-shadow: 0 0 12px rgba(255, 90, 95, 0.7); transform: scale(1.25); }

  /* ── The screen IS the button. One giant arrive target. ────────────────── */
  .giant {
    flex: 1; margin: 14px 16px 10px;
    border: 0; border-radius: 30px; cursor: pointer;
    background:
      radial-gradient(120% 80% at 50% 12%, rgba(255, 122, 85, 0.4), transparent 60%),
      linear-gradient(180deg, var(--coral), #e23f52);
    color: #240709;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 30px 22px;
    box-shadow: 0 22px 60px rgba(255, 90, 95, 0.34), inset 0 2px 0 rgba(255, 255, 255, 0.25);
    transition: transform 0.14s ease;
    position: relative; overflow: hidden;
  }
  .giant:active { transform: scale(0.985); }

  .giant .toward {
    font-family: var(--font-data); font-size: 12px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase; color: rgba(36, 7, 9, 0.7);
  }
  .giant .venue {
    font-family: var(--font-display); font-weight: 800;
    font-size: 46px; line-height: 0.98; letter-spacing: 0.005em;
    text-transform: uppercase; margin: 8px 0 2px;
  }
  .giant .dist {
    font-family: var(--font-data); font-size: 17px; font-weight: 700;
    letter-spacing: 0.02em; color: rgba(36, 7, 9, 0.82); margin-top: 10px;
  }

  .giant .cta {
    margin-top: 34px;
    display: inline-flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .giant .cta .tap {
    font-family: var(--font-display); font-size: 30px; font-weight: 800;
    letter-spacing: 0.05em; text-transform: uppercase;
    padding: 4px 0; border-top: 2px solid rgba(36, 7, 9, 0.35);
    border-bottom: 2px solid rgba(36, 7, 9, 0.35);
  }
  .giant .cta .sub {
    font-family: var(--font-data); font-size: 12px; font-weight: 600;
    letter-spacing: 0.05em; color: rgba(36, 7, 9, 0.7); margin-top: 8px;
  }

  /* crew ribbon inside the giant - glance only, not interactive */
  .ribbon { display: flex; gap: 6px; margin-top: 24px; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px 4px 4px; border-radius: 999px;
    background: rgba(36, 7, 9, 0.16); font-size: 11px; font-weight: 700; color: #2a0a0c;
  }
  .chip .a { width: 20px; height: 20px; border-radius: 50%; background: #240709; color: var(--coral); display: grid; place-items: center; font-size: 10px; }

  /* ── Two escape rails: skip + get-home, both wide, both persistent ─────── */
  .rails {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px));
  }
  .rail {
    min-height: 68px; border-radius: 18px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    font-family: var(--font-display); font-size: 14px; font-weight: 800;
    letter-spacing: 0.08em; text-transform: uppercase;
    background: var(--panel-raised); border: 1px solid var(--line);
  }
  .rail small { font-family: var(--font-data); font-size: 10px; font-weight: 600; letter-spacing: 0.04em; text-transform: none; color: var(--muted); }
  .rail:active { background: var(--panel-hi); }
  .rail.skip { color: var(--brick); }
  .rail.skip small { color: rgba(255, 107, 122, 0.7); }
  .rail.home { color: var(--ink-soft); }
</style>
</head>
<body>
  <p class="caption">
    <b>Option B - One giant action.</b> The whole screen is the arrive button. No scanning, no hunting:
    the venue you are walking to and one huge thumb-slab that checks you in. Skip and get-home wait underneath.
  </p>

  <div class="phone">
    <div class="screen">

      <div class="statusbar">
        <span>22:47</span>
        <span class="vitals">
          <span class="weak">&middot; &middot;</span>
          <span class="batt"><span class="cell"><span class="fill"></span></span>15%</span>
        </span>
      </div>

      <div class="context">
        <div class="crawl">Saturday bender &middot; stop 2 of 3</div>
        <div class="dots">
          <span class="d done"></span>
          <span class="d now"></span>
          <span class="d"></span>
        </div>
      </div>

      <button class="giant">
        <span class="toward">Walk to</span>
        <span class="venue">The Bull<br>&amp; Last</span>
        <span class="dist">4 min &middot; 300 m &middot; up the hill</span>

        <span class="ribbon">
          <span class="chip"><span class="a">P</span>Priya there</span>
          <span class="chip"><span class="a">S</span>Sam here</span>
          <span class="chip"><span class="a">J</span>Jo lagging</span>
        </span>

        <span class="cta">
          <span class="tap">Tap when here</span>
          <span class="sub">Checks the whole crew into stop 2</span>
        </span>
      </button>

      <div class="rails">
        <button class="rail skip">Skip it<small>go to stop 3</small></button>
        <button class="rail home">Get me home<small>last train + cab</small></button>
      </div>

    </div>
  </div>
</body>
</html>
